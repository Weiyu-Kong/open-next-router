syntax "next-router/0.1";

# TaoToken exposes OpenAI-compatible Chat Completions and Responses APIs.
# Upstream API keys are configured in keys.yaml under providers.taotoken.keys.
provider "taotoken" {
  defaults {
    upstream_config {
      base_url = "https://api.taotoken.net/v1";
    }
    auth { auth_bearer; }
    error { error_map openai; }
    response { resp_passthrough; }
    models { models_mode openai; }
  }

  match api = "chat.completions" stream = false {
    request {
      model_map "qwen3.8-max" "None";
      model_map "qwen3.7-max" "None";
      model_map "qwen3.7-plus" "None";
      model_map "qwen3.6-plus" "None";
      model_map "qwen3.6-flash" "None";
      model_map "deepseek-v4-flash" "deepseek-v4-flash";
      model_map "deepseek-v4-flash-vision-exp" "deepseek-v4-flash-vision-exp";
      model_map "deepseek-v4-pro" "deepseek-v4-pro";
      model_map "kimi-k3" "None";
      model_map "minimax-m3" "None";
      model_map "glm-5.3" "glm-5.3";
      model_map "glm-5.3-flash" "glm-5.3-flash";
      model_map "glm-5.2" "None";
      json_replace "$.model" $request.model_mapped;
    }
    metrics { usage_extract openai_chat_completions; finish_reason_extract openai_chat_completions; }
    response { json_replace "$.model" $request.model; }
    upstream { set_path "/chat/completions"; }
  }
  match api = "chat.completions" stream = true {
    request {
      model_map "qwen3.8-max" "None";
      model_map "qwen3.7-max" "None";
      model_map "qwen3.7-plus" "None";
      model_map "qwen3.6-plus" "None";
      model_map "qwen3.6-flash" "None";
      model_map "deepseek-v4-flash" "deepseek-v4-flash";
      model_map "deepseek-v4-flash-vision-exp" "deepseek-v4-flash-vision-exp";
      model_map "deepseek-v4-pro" "deepseek-v4-pro";
      model_map "kimi-k3" "None";
      model_map "minimax-m3" "None";
      model_map "glm-5.3" "glm-5.3";
      model_map "glm-5.3-flash" "glm-5.3-flash";
      model_map "glm-5.2" "None";
      json_replace "$.model" $request.model_mapped;
      json_set "$.stream_options.include_usage" true;
    }
    metrics { usage_extract openai_chat_completions; finish_reason_extract openai_chat_completions; }
    response { json_replace "$.model" $request.model; }
    upstream { set_path "/chat/completions"; }
  }
  match api = "responses" stream = false {
    request {
      model_map "qwen3.8-max" "None";
      model_map "qwen3.7-max" "None";
      model_map "qwen3.7-plus" "None";
      model_map "qwen3.6-plus" "None";
      model_map "qwen3.6-flash" "None";
      model_map "deepseek-v4-flash" "deepseek-v4-flash";
      model_map "deepseek-v4-flash-vision-exp" "deepseek-v4-flash-vision-exp";
      model_map "deepseek-v4-pro" "deepseek-v4-pro";
      model_map "kimi-k3" "None";
      model_map "minimax-m3" "None";
      model_map "glm-5.3" "glm-5.3";
      model_map "glm-5.3-flash" "glm-5.3-flash";
      model_map "glm-5.2" "None";
      json_replace "$.model" $request.model_mapped;
    }
    metrics { usage_extract openai_responses; finish_reason_extract openai_responses; }
    response { json_replace "$.model" $request.model; }
    upstream { set_path "/responses"; }
  }
  match api = "responses" stream = true {
    request {
      model_map "qwen3.8-max" "None";
      model_map "qwen3.7-max" "None";
      model_map "qwen3.7-plus" "None";
      model_map "qwen3.6-plus" "None";
      model_map "qwen3.6-flash" "None";
      model_map "deepseek-v4-flash" "deepseek-v4-flash";
      model_map "deepseek-v4-flash-vision-exp" "deepseek-v4-flash-vision-exp";
      model_map "deepseek-v4-pro" "deepseek-v4-pro";
      model_map "kimi-k3" "None";
      model_map "minimax-m3" "None";
      model_map "glm-5.3" "glm-5.3";
      model_map "glm-5.3-flash" "glm-5.3-flash";
      model_map "glm-5.2" "None";
      json_replace "$.model" $request.model_mapped;
    }
    metrics { usage_extract openai_responses_stream; finish_reason_extract openai_responses; }
    response {
      json_replace "$.model" $request.model;
      json_replace "$.response.model" $request.model;
    }
    upstream { set_path "/responses"; }
  }
}
