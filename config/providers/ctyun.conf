syntax "next-router/0.1";

# Ctyun exposes an OpenAI-compatible chat endpoint. Model IDs are deliberately
# mapped here so proxy behavior remains explicit and provider-owned credentials
# never reach the client.
provider "ctyun" {
  defaults {
    upstream_config {
      base_url = "https://ai.ctaigw.cn/v1";
    }
    auth {
      auth_bearer;
    }
    response {
      resp_passthrough;
    }
  }

  match api = "chat.completions" stream = false {
    request {
      model_map "qwen3.8-max" "3bbfba16dd6e4fed90af61eee76db87f";
      model_map "qwen3.7-max" "547f9804945c492a9d536bcbff15fb1a";
      model_map "qwen3.7-plus" "98df9efe26894003be658e1e70ff0105";
      model_map "qwen3.6-plus" "3fd7b6be3bea4f66adc276af23b5c52b";
      model_map "qwen3.6-flash" "c7aca8b6434e4a448e9e3ace7815b74f";
      model_map "deepseek-v4-flash-0817" "c60c9aec5710499dafae8e4f395698d8";
      model_map "deepseek-v4-pro-0817" "20e81bd57e7a4be281e5d0ef0afc93d8";
      model_map "kimi-k3" "76ab208968e0414b927a9a6a97dfc3e1";
      model_map "minimax-m3" "62cc400ee35e43808b1688fcbc9c3e88";
      model_map "glm-5.3" "e8e2511658054053a7e56e950d80f0e4";
      model_map "glm-5.2" "fc59cc3375d54264b1b6011e46959ca4";
      json_replace "$.model" $request.model_mapped;
    }
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
    response {
      json_replace "$.model" $request.model;
    }
    upstream { set_path "/chat/completions"; }
  }

  match api = "chat.completions" stream = true {
    request {
      model_map "qwen3.8-max" "3bbfba16dd6e4fed90af61eee76db87f";
      model_map "qwen3.7-max" "547f9804945c492a9d536bcbff15fb1a";
      model_map "qwen3.7-plus" "98df9efe26894003be658e1e70ff0105";
      model_map "qwen3.6-plus" "3fd7b6be3bea4f66adc276af23b5c52b";
      model_map "qwen3.6-flash" "c7aca8b6434e4a448e9e3ace7815b74f";
      model_map "deepseek-v4-flash-0817" "c60c9aec5710499dafae8e4f395698d8";
      model_map "deepseek-v4-pro-0817" "20e81bd57e7a4be281e5d0ef0afc93d8";
      model_map "kimi-k3" "76ab208968e0414b927a9a6a97dfc3e1";
      model_map "minimax-m3" "62cc400ee35e43808b1688fcbc9c3e88";
      model_map "glm-5.3" "e8e2511658054053a7e56e950d80f0e4";
      model_map "glm-5.2" "fc59cc3375d54264b1b6011e46959ca4";
      json_replace "$.model" $request.model_mapped;
      json_set "$.stream_options.include_usage" true;
    }
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
    response {
      json_replace "$.model" $request.model;
    }
    upstream { set_path "/chat/completions"; }
  }
}
