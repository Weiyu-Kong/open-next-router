syntax "next-router/0.1";

# Kimi exposes an OpenAI-compatible Chat Completions API.
# Upstream API keys are configured in keys.yaml under providers.kimi.keys.
provider "kimi" {
  defaults {
    upstream_config {
base_url = "https://api.moonshot.ai/v1";
    }
    auth { auth_bearer; }
    error { error_map openai; }
    response { resp_passthrough; }
models {
  models_mode openai;
  path "/models";
}
  }

  match api = "chat.completions" stream = false {
    request {
      model_map "kimi-k3" "kimi-k3";
      model_map "kimi-k2.7-code" "kimi-k2.7-code";
      model_map "kimi-k2.7-code-highspeed" "kimi-k2.7-code-highspeed";
      model_map "kimi-k2.6" "kimi-k2.6";
      json_replace "$.model" $request.model_mapped;
    }
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
    response { json_replace "$.model" $request.model; }
    upstream { set_path "/chat/completions"; }
  }

  match api = "chat.completions" stream = true {
    request {
      model_map "kimi-k3" "kimi-k3";
      model_map "kimi-k2.7-code" "kimi-k2.7-code";
      model_map "kimi-k2.7-code-highspeed" "kimi-k2.7-code-highspeed";
      model_map "kimi-k2.6" "kimi-k2.6";
      json_replace "$.model" $request.model_mapped;
      json_set "$.stream_options.include_usage" true;
    }
    metrics {
      usage_extract openai_chat_completions;
      finish_reason_extract openai_chat_completions;
    }
    response { json_replace "$.model" $request.model; }
    upstream { set_path "/chat/completions"; }
  }
}
