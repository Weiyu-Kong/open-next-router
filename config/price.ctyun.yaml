version: v1
source:
  url: "reference/ctyun/api_docs/ctyun-model/model-prices"
  fetched_at: "2026-08-28T00:00:00Z"
  providers:
    - ctyun
unit: "cny_per_1m_tokens"

# Ctyun list prices, in CNY per one million tokens. Keep these entries keyed
# by the public model names from config/providers/ctyun.conf; the UUIDs in the
# model_map directives are upstream transport identifiers, not customer model
# identities.
entries:
