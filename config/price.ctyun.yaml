    model: qwen3.7-max
    cost:
      input: 12
      cache_read: 2.4
      output: 36
  - provider: ctyun
    model: qwen3.7-plus
    cost:
      input: 2
      cache_read: 0.4
      output: 8
  - provider: ctyun
    model: qwen3.6-plus
    cost:
      input: 2
      output: 12
